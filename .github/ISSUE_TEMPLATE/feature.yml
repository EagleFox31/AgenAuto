name: Feature / Enabler
description: Proposer une évolution produit, data ou plateforme avec des critères d’acceptation clairs.
title: "[P?] "
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Quel problème voulons-nous résoudre ?
      placeholder: Décrire le résultat attendu, pas seulement la solution technique.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Ce qui est explicitement inclus dans cette issue.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Conditions vérifiables pour considérer le travail terminé.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 — Blocking
        - P1 — MVP Core
        - P2 — MVP Completion
        - P3 — Post-MVP
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / related issues
      placeholder: "#1, #2 or None"
  - type: textarea
    id: notes
    attributes:
      label: Technical / product notes
      description: ADR, API, data, security or observability considerations if relevant.
