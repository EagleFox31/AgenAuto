name: Assemble AgenAuto document

on:
  push:
    paths:
      - '.b64parts/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify staged chunks
        shell: bash
        run: |
          set -euo pipefail
          wc -c .b64parts/part*
          sha256sum .b64parts/part*
          python - <<'PY'
          from pathlib import Path
          import hashlib, sys
          expected = {
              'part01': ('10000', '220aea3db695ec7e8fd8a2017b9b100da2b0bda64b91a0f6202bb071a854db40'),
              'part02': ('10000', 'f85c8c77308c8950e1ec03a836acb6f53d72df2485eda29220d0d8cde0829d12'),
              'part03': ('10000', 'd8b71571f03d01c9dc58107eb2e00883a14d50ada8c17b7dec2af1fb8c4e3b73'),
              'part04': ('10000', '22aa270c7fc9523ae89087f4d301080de2077a290f1787a6949d460e2b59d4ad'),
              'part05': ('10000', '074a06eeee09af8eb80817363655a9ee68e90e2af17dc1add117f020995abb12'),
              'part06': ('10000', 'fb37ac6dca7223908da536ddcc400fbb9ad92ebd0155b2ba020acf4cf48a6727'),
              'part07': ('6900', 'c73fd8b4cf23ef0e0a1072c873b6ccd7046f6f22c9368c37e2d168db0f5e1d4b'),
          }
          bad = []
          for name, (size, digest) in expected.items():
              p = Path('.b64parts') / name
              data = p.read_bytes()
              actual = hashlib.sha256(data).hexdigest()
              if len(data) != int(size) or actual != digest:
                  bad.append((name, len(data), actual))
          if bad:
              print('MISMATCHES:', bad)
              sys.exit(1)
          print('All staged chunks match local hashes')
          PY

      - name: Rebuild and validate DOCX
        shell: bash
        run: |
          set -euo pipefail
          cat .b64parts/part* | base64 --decode > docs/Concept_AppFactory_AgenAuto.docx
          test "$(stat -c%s docs/Concept_AppFactory_AgenAuto.docx)" -eq 50175
          python - <<'PY'
          import zipfile
          path = 'docs/Concept_AppFactory_AgenAuto.docx'
          with zipfile.ZipFile(path) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'Invalid DOCX ZIP member: {bad}')
              assert 'word/document.xml' in z.namelist()
          print('DOCX validation OK')
          PY

      - name: Commit final document and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .b64parts
          rm -f .github/workflows/assemble-docx.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: add AgenAuto AppFactory concept document"
          git push
