name: Bootstrap validation

on:
  push:
    branches:
      - feat/bootstrap-payload-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agenauto
          POSTGRES_USER: agenauto
          POSTGRES_PASSWORD: agenauto-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenauto -d agenauto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      DATABASE_URL: postgresql://agenauto:agenauto-ci@localhost:5432/agenauto
      PAYLOAD_SECRET: bootstrap-validation-only-not-a-production-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.20.0 --activate
          pnpm --version

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Generate Payload import map
        run: pnpm --dir apps/web generate:importmap

      - name: Generate Payload types
        run: pnpm --dir apps/web generate:types

      - name: Generate initial migration when missing
        shell: bash
        run: |
          if compgen -G "apps/web/src/migrations/*.ts" > /dev/null; then
            echo "Committed migrations already exist; generation skipped."
          else
            pnpm --dir apps/web payload migrate:create initial-foundation --skip-empty
          fi

      - name: Apply migrations to empty PostgreSQL database
        run: pnpm --dir apps/web payload migrate

      - name: Check migration status
        run: pnpm --dir apps/web payload migrate:status

      - name: Lint
        run: pnpm --dir apps/web lint

      - name: Typecheck
        run: pnpm --dir apps/web typecheck

      - name: Build
        run: pnpm --dir apps/web build

      - name: Persist generated foundation artifacts
        if: github.ref_name == 'feat/bootstrap-payload-foundation' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pnpm-lock.yaml apps/web/src/payload-types.ts 'apps/web/src/app/(payload)/admin/importMap.js' apps/web/src/migrations

          if git diff --cached --quiet; then
            echo "Generated foundation artifacts are already committed."
          else
            git commit -m "chore: commit generated Payload foundation artifacts"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Archive generated foundation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agenauto-bootstrap-generated
          if-no-files-found: error
          path: |
            pnpm-lock.yaml
            apps/web/src/payload-types.ts
            apps/web/src/app/(payload)/admin/importMap.js
            apps/web/src/migrations/
