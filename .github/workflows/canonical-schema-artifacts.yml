name: Canonical schema artifacts

on:
  push:
    branches:
      - feat/canonical-automotive-schema
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agenauto
          POSTGRES_USER: agenauto
          POSTGRES_PASSWORD: agenauto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenauto -d agenauto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      DATABASE_URL: postgresql://agenauto:agenauto@localhost:5432/agenauto
      PAYLOAD_SECRET: canonical-schema-ci-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.20.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Payload types and import map
        run: |
          pnpm --dir apps/web generate:types
          pnpm --dir apps/web generate:importmap

      - name: Apply existing migrations
        run: pnpm --dir apps/web payload migrate

      - name: Generate canonical automotive migration
        run: pnpm --dir apps/web payload migrate:create canonical_automotive_schema --skip-empty

      - name: Apply generated migration
        run: pnpm --dir apps/web payload migrate

      - name: Validate source
        run: |
          pnpm --dir apps/web lint
          pnpm --dir apps/web typecheck
          pnpm --dir apps/web build

      - name: Commit generated Payload artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/payload-types.ts 'apps/web/src/app/(payload)/admin/importMap.js' apps/web/src/migrations
          if git diff --cached --quiet; then
            echo "No generated artifacts changed."
            exit 0
          fi
          git commit -m "chore: generate Payload schema artifacts"
          git push origin HEAD:${GITHUB_REF_NAME}
