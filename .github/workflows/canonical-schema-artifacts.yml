name: Canonical schema artifacts

on:
  push:
    branches: [feat/canonical-automotive-schema]

permissions:
  contents: write

jobs:
  generate-and-validate:
    if: ${{ !contains(github.event.head_commit.message, 'chore: generate Payload schema artifacts') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agenauto
          POSTGRES_USER: agenauto
          POSTGRES_PASSWORD: agenauto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenauto -d agenauto"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://agenauto:agenauto@localhost:5432/agenauto
      PAYLOAD_SECRET: canonical-schema-ci-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Payload types and import map
        run: |
          pnpm generate:types
          pnpm generate:importmap

      - name: Apply existing migrations
        run: pnpm migrate

      - name: Generate canonical automotive migration
        run: pnpm migrate:create canonical_automotive_schema --skip-empty

      - name: Apply generated migration
        run: pnpm migrate

      - name: Validate source
        run: |
          pnpm lint
          pnpm typecheck
          pnpm build

      - name: Commit generated Payload artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/payload-types.ts "apps/web/src/app/(payload)/admin/importMap.js" apps/web/src/migrations
          if git diff --cached --quiet; then
            echo "No generated artifacts changed."
            exit 0
          fi
          git commit -m "chore: generate Payload schema artifacts"
          git push origin HEAD:${{ github.ref_name }}
