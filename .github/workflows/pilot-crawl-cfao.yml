name: Pilot crawl - CFAO Toyota Suzuki

on:
  push:
    branches:
      - feat/cameroon-pilot-ingestion
    paths:
      - 'services/ingestion/src/agenauto_ingestion/collectors/cfao.py'
      - 'services/ingestion/src/agenauto_ingestion/models.py'
      - 'services/ingestion/src/agenauto_ingestion/normalization.py'
      - 'services/ingestion/src/agenauto_ingestion/provenance.py'
      - 'services/ingestion/src/agenauto_ingestion/cli.py'
      - 'services/ingestion/tests/test_cfao.py'
      - '.github/workflows/pilot-crawl-cfao.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@v4
        with:
          ref: feat/cameroon-pilot-ingestion
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ingestion/pyproject.toml
      - name: Install ingestion service
        run: python -m pip install -e 'services/ingestion[dev]'
      - name: Lint
        run: ruff check services/ingestion
      - name: Tests
        run: pytest services/ingestion/tests
      - name: Crawl official CFAO Toyota and Suzuki catalogues
        run: agenauto-ingest cfao --output-root data/pilot/cfao
      - name: Validate Toyota pilot data
        run: >-
          agenauto-ingest validate
          --input data/pilot/cfao/toyota/candidates.json
          --minimum-models 15
          --brand Toyota
          --allowed-host toyota.cami-cfao.com
      - name: Validate Suzuki pilot data
        run: >-
          agenauto-ingest validate
          --input data/pilot/cfao/suzuki/candidates.json
          --minimum-models 10
          --brand Suzuki
          --allowed-host suzuki.cami-cfao.com
      - name: Commit factual CFAO pilot observations
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pilot/cfao
          if git diff --cached --quiet; then
            echo 'No CFAO pilot data changes.'
            exit 0
          fi
          git commit -m 'data: refresh CFAO Toyota Suzuki pilot observations [skip ci]'
          git push origin HEAD:feat/cameroon-pilot-ingestion
