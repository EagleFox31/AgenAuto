name: Pilot crawl - Tractafric Hyundai Mitsubishi

on:
  push:
    branches:
      - feat/cameroon-pilot-ingestion
    paths:
      - 'services/ingestion/src/agenauto_ingestion/collectors/tractafric.py'
      - 'services/ingestion/src/agenauto_ingestion/models.py'
      - 'services/ingestion/src/agenauto_ingestion/normalization.py'
      - 'services/ingestion/src/agenauto_ingestion/provenance.py'
      - 'services/ingestion/src/agenauto_ingestion/cli.py'
      - 'services/ingestion/tests/test_tractafric.py'
      - '.github/workflows/pilot-crawl-tractafric.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@v4
        with:
          ref: feat/cameroon-pilot-ingestion
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ingestion/pyproject.toml
      - name: Install ingestion service
        run: python -m pip install -e 'services/ingestion[dev]'
      - name: Lint
        run: ruff check services/ingestion
      - name: Tests
        run: pytest services/ingestion/tests
      - name: Crawl official Tractafric Hyundai and Mitsubishi catalogues
        run: agenauto-ingest tractafric --output-root data/pilot/tractafric
      - name: Validate Hyundai pilot data
        run: >-
          agenauto-ingest validate
          --input data/pilot/tractafric/hyundai/candidates.json
          --minimum-models 4
          --brand Hyundai
          --allowed-host tractafrictmc-cameroun.com
          --allowed-host www.tractafrictmc-cameroun.com
      - name: Validate Mitsubishi pilot data
        run: >-
          agenauto-ingest validate
          --input data/pilot/tractafric/mitsubishi/candidates.json
          --minimum-models 4
          --brand Mitsubishi
          --allowed-host tractafrictmc-cameroun.com
          --allowed-host www.tractafrictmc-cameroun.com
      - name: Commit factual Tractafric pilot observations
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pilot/tractafric
          if git diff --cached --quiet; then
            echo 'No Tractafric pilot data changes.'
            exit 0
          fi
          git commit -m 'data: refresh Tractafric Hyundai Mitsubishi pilot observations [skip ci]'
          git push origin HEAD:feat/cameroon-pilot-ingestion
