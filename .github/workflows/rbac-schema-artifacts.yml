name: RBAC schema artifacts

on:
  push:
    branches:
      - feat/payload-auth-rbac-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agenauto
          POSTGRES_USER: agenauto
          POSTGRES_PASSWORD: agenauto-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenauto -d agenauto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      DATABASE_URL: postgresql://agenauto:agenauto-ci@localhost:5432/agenauto
      PAYLOAD_SECRET: rbac-schema-artifacts-only-not-a-production-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/payload-auth-rbac-audit
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Payload import map and types
        run: |
          pnpm generate:importmap
          pnpm generate:types

      - name: Apply existing migrations
        run: pnpm migrate

      - name: Generate reviewed RBAC migration
        run: pnpm --dir apps/web payload migrate:create payload_auth_rbac_audit --skip-empty

      - name: Apply generated migration
        run: pnpm migrate

      - name: Run tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Commit generated Payload artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/payload-types.ts \
            'apps/web/src/app/(payload)/admin/importMap.js' \
            apps/web/src/migrations

          if git diff --cached --quiet; then
            echo "No generated artifacts changed."
            exit 0
          fi

          git commit -m "chore: generate RBAC schema artifacts [skip ci]"
          git push origin HEAD:feat/payload-auth-rbac-audit
