[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agenauto-ingestion"
version = "0.1.0"
description = "Traceable collectors and normalization helpers for AgenAuto pilot data"
requires-python = ">=3.12"
dependencies = [
  "crawlee[beautifulsoup]==1.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
agenauto-ingest = "agenauto_ingestion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agenauto_ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
